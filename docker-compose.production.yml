version: "3.8"

services:
  kingdom-commander:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kingdom-commander
    environment:
      - NODE_ROLE=commander
      - KINGDOM_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - kingdom-commander-data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  kingdom-knight-coder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kingdom-knight-coder
    environment:
      - NODE_ROLE=coder
      - KINGDOM_PORT=8001
      - COMMANDER_URL=http://kingdom-commander:8000
    ports:
      - "8001:8001"
    volumes:
      - kingdom-coder-data:/app/data
    depends_on:
      kingdom-commander:
        condition: service_healthy
    restart: unless-stopped

  kingdom-knight-researcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kingdom-knight-researcher
    environment:
      - NODE_ROLE=researcher
      - KINGDOM_PORT=8002
      - COMMANDER_URL=http://kingdom-commander:8000
    ports:
      - "8002:8002"
    volumes:
      - kingdom-researcher-data:/app/data
    depends_on:
      kingdom-commander:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kingdom-commander-data:
  kingdom-coder-data:
  kingdom-researcher-data:
