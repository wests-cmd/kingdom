name: Retire reviewed Kingdom branches once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-reviewed-once.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Retire audited branches only after verifying 35 archive tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETIRE_MODE: archive-and-delete
          RETIRE_CONFIRMATION: ARCHIVE_AND_RETIRE_35
        run: python3 scripts/retire_historical_branches.py
