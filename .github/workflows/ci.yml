name: Kingdom CI & Release Pipeline

on:
  push:
    branches: [ main, master, phase-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Tests & Distributed E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller
      - name: Run Backend Unit Tests & Distributed Process E2E Suite
        run: |
          python3 -m pytest

  build-frontend:
    name: Build Production Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Frontend Dependencies & Compile Bundle
        run: |
          cd frontend
          npm ci
          npm run build

  build-desktop-release:
    name: Package Desktop Release
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24 & Python 3.12
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python PyInstaller & Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Compile Standalone Backend Executable
        run: |
          pyinstaller --onefile --name kingdom-backend backend/main.py
          mkdir -p desktop/bin
          cp dist/kingdom-backend desktop/bin/kingdom-backend
          chmod +x desktop/bin/kingdom-backend
      - name: Build Production Frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Package Desktop Artifacts (AppImage & DEB)
        run: |
          cd desktop
          npm ci
          n=0
          until [ $n -ge 3 ]; do
            npm run build && break
            n=$((n+1))
            echo "Desktop build failed (transient download reset). Retrying in 5 seconds ($n/3)..."
            sleep 5
          done
          [ $n -lt 3 ]
      - name: Verify Release Artifacts & Generate SHA-256 Checksums
        run: |
          ls -la desktop/dist
          VERSION=$(python3 scripts/validate_version.py --print-version)
          sha256sum desktop/dist/Kingdom-${VERSION}.AppImage > desktop/dist/Kingdom-${VERSION}.AppImage.sha256
          sha256sum desktop/dist/kingdom-desktop_${VERSION}_amd64.deb > desktop/dist/kingdom-desktop_${VERSION}_amd64.deb.sha256
          cat desktop/dist/*.sha256
