name: Retire reviewed final four Kingdom branches once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-final-four-once.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: kingdom-historical-branch-retirement
  cancel-in-progress: false

jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Retire only reviewed archived SHA-pinned branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETIRE_MODE: archive-and-delete
          RETIRE_CONFIRMATION: ARCHIVE_AND_RETIRE_35
        run: python3 scripts/retire_historical_branches.py
