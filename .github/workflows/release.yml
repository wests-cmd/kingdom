name: Kingdom Automated Production Release Pipeline (v1TAS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release title'
        required: true
        default: 'Kingdom v1TAS'
      release_notes:
        description: 'Release notes'
        required: true
        default: 'Kingdom v1TAS — first stable production release.'
      release_channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - stable
          - rc
          - beta
        default: stable

permissions:
  contents: write
  packages: write
  security-events: read

jobs:
  validate-and-test:
    name: Validate Version & Execute Production Test Suite
    runs-on: ubuntu-latest
    outputs:
      canonical_version: ${{ steps.version.outputs.version }}
      git_tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller

      - name: Resolve & Validate Canonical Version
        id: version
        run: |
          VERSION=$(python3 scripts/validate_version.py --print-version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

          python3 scripts/validate_version.py --tag "$TAG_NAME"

      - name: Run Full Pytest Test Suite
        run: |
          python -m pytest --maxfail=1

  build-desktop-matrix:
    name: Build Native Desktop Packages (${{ matrix.platform }}-${{ matrix.arch }})
    needs: validate-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Standalone Backend Binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name kingdom-backend --distpath desktop/bin backend/main.py
          chmod +x desktop/bin/kingdom-backend

      - name: Compile Standalone Backend Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name kingdom-backend --distpath desktop/bin backend/main.py

      - name: Build Frontend Production Static Assets
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Package Desktop Application
        run: |
          cd desktop
          npm ci
          npm run build
          cd ..

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/dist/

  assemble-and-publish:
    name: Assemble Manifest, Checksums & Publish Official Release
    needs: [validate-and-test, build-desktop-matrix]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Desktop Build Matrix Artifacts
        uses: actions/download-artifact@v4
        with:
          path: matrix_artifacts/

      - name: Assemble Staging Release Directory & Artifacts
        run: |
          VERSION="${{ needs.validate-and-test.outputs.canonical_version }}"
          mkdir -p release_staging

          # Flatten downloaded artifacts
          find matrix_artifacts -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" -o -name "*.dmg" \) -exec cp {} release_staging/ \;

          cd release_staging

          # Generate release-manifest.json
          python3 -c "
          import os, json, glob, hashlib

          version = '$VERSION'
          commit = '${{ github.sha }}'
          tag = '${{ needs.validate-and-test.outputs.git_tag }}'
          release_name = '${{ github.event.inputs.release_title || \"Kingdom v1TAS\" }}'

          artifacts = []
          for fname in sorted(os.listdir('.')):
              if fname in ['SHA256SUMS', 'release-manifest.json']:
                  continue
              fpath = os.path.join('.', fname)
              size = os.path.getsize(fpath)
              sha = hashlib.sha256(open(fpath, 'rb').read()).hexdigest()

              platform = 'linux'
              if fname.endswith('.exe'):
                  platform = 'windows'
              elif fname.endswith('.dmg'):
                  platform = 'macos'

              artifacts.append({
                  'filename': fname,
                  'size': size,
                  'sha256': sha,
                  'platform': platform,
                  'arch': 'x64' if 'x64' in fname or 'amd64' in fname or platform != 'macos' else 'arm64'
              })

          manifest = {
              'product': 'Kingdom',
              'version': version,
              'release_name': release_name,
              'tag': tag,
              'commit': commit,
              'release_channel': '${{ github.event.inputs.release_channel || \"stable\" }}',
              'build_timestamp': '${{ github.event.head_commit.timestamp || \"\" }}',
              'artifacts': artifacts,
              'compatibility': {
                  'kingdom_api_version': 'v1',
                  'centipede_protocol_version': 'v1',
                  'schema_version': '1.0'
              }
          }

          with open('release-manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "

          # Generate SHA256SUMS for all binaries and manifest
          sha256sum * > SHA256SUMS

          cat release-manifest.json
          cat SHA256SUMS
          cd ..

      - name: Validate Release Staging Artifacts & Hash Integrity
        run: |
          python3 scripts/validate_version.py --artifacts-dir release_staging

      - name: Create or Update Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-and-test.outputs.git_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event.inputs.release_title || 'Kingdom v1TAS' }} (v${{ needs.validate-and-test.outputs.canonical_version }})
          body: |
            # ${{ github.event.inputs.release_title || 'Kingdom v1TAS' }} (v${{ needs.validate-and-test.outputs.canonical_version }}) Official Production Release

            Commit: `${{ github.sha }}`
            Release Channel: `${{ github.event.inputs.release_channel || 'stable' }}`

            ## Release Notes
            ${{ github.event.inputs.release_notes || 'Kingdom v1TAS — first stable production release.' }}

            ## Release Highlights
            - First Cross-Platform Stable Production Release (`Kingdom v1TAS` / Semantic Version `1.0.0`)
            - Zero-Trust Distributed AI Runtime & Orchestration Infrastructure
            - Cross-Platform Native Bundled Desktop Package Matrix (Windows NSIS, macOS DMG, Linux AppImage/DEB)
            - Centipede OS Compatibility Protocol v1

            ## Cryptographic Verification
            Please verify artifact checksums using `SHA256SUMS` included in this release package.
          files: release_staging/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
