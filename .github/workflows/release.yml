name: Verified native release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/*release*'
      - 'scripts/*native*'
      - 'scripts/*version*'
      - 'docs/releases/**'
      - 'scripts/desktop_backend.py'
      - 'requirements-release.txt'
      - 'requirements.txt'
      - 'backend/**'
      - 'frontend/**'
      - 'desktop/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: Resolve reviewed release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: release
        run: python scripts/validate_version.py --release-identity >> "$GITHUB_OUTPUT"

  native-build:
    name: Verify ${{ matrix.platform }} x86_64
    needs: identity
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            backend: desktop/bin/kingdom-backend
            app: desktop/dist/linux-unpacked/kingdom-desktop
          - os: windows-latest
            platform: windows
            backend: desktop/bin/kingdom-backend.exe
            app: desktop/dist/win-unpacked/Kingdom.exe
          - os: macos-15-intel
            platform: macos
            backend: desktop/bin/kingdom-backend
            app: desktop/dist/mac/Kingdom.app/Contents/MacOS/Kingdom
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test and build dependencies
        run: |
          python -m venv .release-venv
          if [ '${{ matrix.platform }}' = windows ]; then
            VENV_BIN="$PWD/.release-venv/Scripts"
            cygpath -w "$VENV_BIN" >> "$GITHUB_PATH"
          else
            VENV_BIN="$PWD/.release-venv/bin"
            echo "$VENV_BIN" >> "$GITHUB_PATH"
          fi
          "$VENV_BIN/python" -m pip install --upgrade pip
          if [ '${{ matrix.platform }}' = macos ]; then
            # Current upstream wheels omit Intel macOS. Build the patched version
            # with a pinned static OpenSSL to avoid frozen dylib collisions.
            curl --fail --location --retry 3 -o openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
            echo '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl.tar.gz' | shasum -a 256 -c -
            tar xzf openssl.tar.gz
            cd openssl-3.5.9
            ./Configure darwin64-x86_64-cc no-shared no-tests --prefix="$GITHUB_WORKSPACE/.release-openssl"
            make -j3
            make install_sw
            cd "$GITHUB_WORKSPACE"
            OPENSSL_STATIC=1 OPENSSL_DIR="$GITHUB_WORKSPACE/.release-openssl" "$VENV_BIN/python" -m pip install --no-cache-dir --no-binary=cryptography -r requirements-release.txt
            CRYPTO_LIBRARY=$("$VENV_BIN/python" -c 'import cryptography.hazmat.bindings._rust as r; print(r.__file__)')
            otool -L "$CRYPTO_LIBRARY" | tee cryptography-linkage.txt
            if grep -E 'lib(ssl|crypto).*dylib' cryptography-linkage.txt; then
              echo 'Cryptography must not depend on external OpenSSL dylibs.'
              exit 1
            fi
          else
            "$VENV_BIN/python" -m pip install --only-binary=cryptography -r requirements-release.txt
          fi
      - name: Audit installed Python dependencies
        run: python scripts/audit_release_dependencies.py
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend audit --audit-level=high
          npm --prefix frontend run build
      - name: Validate version and run tests against built web assets
        run: |
          python scripts/validate_version.py --tag "$RELEASE_TAG"
          python -m pytest --maxfail=1
      - name: Build native frozen backend
        run: python scripts/build_native_backend.py
      - name: Exercise native backend from clean directory
        run: python scripts/smoke_native_backend.py '${{ matrix.backend }}' evidence/backend.json
      - name: Package native desktop installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm --prefix desktop ci
          npm --prefix desktop audit --audit-level=high
          npm --prefix desktop run build -- --x64 --publish never
      - name: Exercise actual native installer setup and dashboard
        run: python scripts/smoke_native_installer.py '${{ matrix.platform }}'
      - name: Preserve installer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-failure-${{ matrix.platform }}
          path: evidence/
          retention-days: 3
      - name: Stage required installers, hashes, and evidence
        run: python scripts/release_artifacts.py stage --platform '${{ matrix.platform }}' --version "$RELEASE_VERSION" --commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: kingdom-verified-${{ matrix.platform }}
          path: release_staging/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified release
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [identity, native-build]
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_NOTES: ${{ needs.identity.outputs.notes }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: kingdom-verified-*
          merge-multiple: true
          path: release_staging
      - name: Independently verify downloaded build artifacts
        run: |
          python scripts/release_artifacts.py verify --version "$RELEASE_VERSION" --commit '${{ github.sha }}'
          cd release_staging
          sha256sum -c SHA256SUMS
      - name: Create draft, verify uploaded bytes, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api 'repos/'"$GH_REPO"'/git/ref/heads/main' --jq .object.sha | grep -Fx "$RELEASE_COMMIT"
          python scripts/validate_version.py --release-identity > verified-identity.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > existing-release.txt 2>/dev/null; then
            if [ "$(cat existing-release.txt)" != true ]; then
              echo "A published $RELEASE_TAG already exists; refusing to replace stable assets."
              exit 1
            fi
            gh release delete "$RELEASE_TAG" --yes
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > existing-tag.json 2>/dev/null; then
            python -c 'import json,os; t=json.load(open("existing-tag.json"))["object"]; assert t["type"] == "commit" and t["sha"] == os.environ["RELEASE_COMMIT"], "Existing tag targets different source"'
          else
            gh api --method POST 'repos/'"$GH_REPO"'/git/refs' -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_COMMIT"
          fi
          gh release create "$RELEASE_TAG" release_staging/* --verify-tag --target "$RELEASE_COMMIT" --title "Kingdom v1TAS ($RELEASE_TAG)" --notes-file "$RELEASE_NOTES" --draft
          gh release download "$RELEASE_TAG" --dir release_download
          diff -u release_staging/SHA256SUMS release_download/SHA256SUMS
          cd release_download
          sha256sum -c SHA256SUMS
          cd ..
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha | grep -Fx "$RELEASE_COMMIT"
          gh api 'repos/'"$GH_REPO"'/git/ref/heads/main' --jq .object.sha | grep -Fx "$RELEASE_COMMIT"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --notes-file "$RELEASE_NOTES"
          gh release view "$RELEASE_TAG" --json url,isDraft,assets
