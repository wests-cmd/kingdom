name: Verified native release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/*release*'
      - 'scripts/*native*'
      - 'scripts/desktop_backend.py'
      - 'requirements-release.txt'

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-build:
    name: Verify ${{ matrix.platform }} x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            backend: desktop/bin/kingdom-backend
            app: desktop/dist/linux-unpacked/kingdom-desktop
          - os: windows-latest
            platform: windows
            backend: desktop/bin/kingdom-backend.exe
            app: desktop/dist/win-unpacked/Kingdom.exe
          - os: macos-15-intel
            platform: macos
            backend: desktop/bin/kingdom-backend
            app: desktop/dist/mac/Kingdom.app/Contents/MacOS/Kingdom
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Validate version and run tests
        run: |
          python scripts/validate_version.py --tag v1.0.0
          python -m pytest --maxfail=1
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend audit --audit-level=high
          npm --prefix frontend run build
      - name: Build native frozen backend
        run: python scripts/build_native_backend.py
      - name: Exercise native backend from clean directory
        run: python scripts/smoke_native_backend.py '${{ matrix.backend }}' evidence/backend.json
      - name: Package native desktop installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm --prefix desktop ci
          npm --prefix desktop audit --audit-level=high
          npm --prefix desktop run build -- --x64 --publish never
      - name: Exercise actual native installer setup and dashboard
        run: python scripts/smoke_native_installer.py '${{ matrix.platform }}'
      - name: Stage required installers, hashes, and evidence
        run: python scripts/release_artifacts.py stage --platform '${{ matrix.platform }}' --version 1.0.0 --commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: kingdom-verified-${{ matrix.platform }}
          path: release_staging/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified v1.0.0
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/tags/v1.0.0')
    needs: native-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: kingdom-verified-*
          merge-multiple: true
          path: release_staging
      - name: Independently verify downloaded build artifacts
        run: |
          python scripts/release_artifacts.py verify --version 1.0.0 --commit '${{ github.sha }}'
          cd release_staging
          sha256sum -c SHA256SUMS
      - name: Create draft, verify uploaded bytes, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --json isDraft --jq .isDraft > existing-release.txt 2>/dev/null; then
            if [ "$(cat existing-release.txt)" != true ]; then
              echo 'A published v1.0.0 already exists; refusing to replace stable assets.'
              exit 1
            fi
            gh release view v1.0.0 --json targetCommitish --jq .targetCommitish | grep -Fx "$RELEASE_COMMIT"
            gh release upload v1.0.0 release_staging/* --clobber
          else
            gh release create v1.0.0 release_staging/* --target "$RELEASE_COMMIT" --title 'Kingdom v1TAS (v1.0.0)' --notes-file release-notes.md --draft
          fi
          gh release download v1.0.0 --dir release_download
          diff -u release_staging/SHA256SUMS release_download/SHA256SUMS
          cd release_download
          sha256sum -c SHA256SUMS
          cd ..
          gh api 'repos/'"$GH_REPO"'/git/ref/tags/v1.0.0' --jq .object.sha | grep -Fx "$RELEASE_COMMIT"
          gh release edit v1.0.0 --draft=false --prerelease=false --latest --notes-file release-notes.md
          gh release view v1.0.0 --json url,isDraft,assets
