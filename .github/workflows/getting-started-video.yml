name: Build getting-started video

on:
  push:
    branches:
      - main
      - 'docs/quickstart-video-*'
    paths:
      - scripts/build_getting_started_video.py
      - .github/workflows/getting-started-video.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/build_getting_started_video.py
      - .github/workflows/getting-started-video.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-getting-started-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'docs/quickstart-video-') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak
          python -m pip install 'Pillow==12.3.0'
      - name: Build narrated MP4 and animated preview
        run: python scripts/build_getting_started_video.py --output-dir docs/media
      - name: Verify documentation after rendering
        run: python scripts/check_docs.py
      - name: Upload reviewable tutorial media
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-getting-started-video
          path: |
            docs/media/kingdom-getting-started.mp4
            docs/media/kingdom-getting-started-preview.gif
          if-no-files-found: error
          retention-days: 14
      # Never commit from main: that could change the release's exact-source
      # SHA while native installer publication is still in progress.
      # The PR branch carries media together with its reviewed source.
      - name: Commit rendered media to the documentation branch
        if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'docs/quickstart-video-') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/kingdom-getting-started.mp4 docs/media/kingdom-getting-started-preview.gif
          if git diff --cached --quiet; then
            echo "Video is already current."
          else
            git commit -m "docs: publish reviewed v1.2.6 narrated tutorial media"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
