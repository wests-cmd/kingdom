name: Build getting-started video
on:
  push:
    branches:
      - main
      - integration/kingdom-cohesion-20261119
    paths:
      - scripts/build_getting_started_video.py
      - .github/workflows/getting-started-video.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kingdom-getting-started-video
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak
          python -m pip install Pillow
      - name: Build narrated MP4 and animated preview
        run: python scripts/build_getting_started_video.py --output-dir docs/media
      - name: Check documentation after rendering
        run: python scripts/check_docs.py
      - name: Commit media assets onto the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/kingdom-getting-started.mp4 docs/media/kingdom-getting-started-preview.gif
          if git diff --cached --quiet; then
            echo "Video is already current."
          else
            git commit -m "docs: publish narrated Kingdom getting-started video"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
