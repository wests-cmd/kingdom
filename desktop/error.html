<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kingdom Desktop — Startup Error</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121417;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #1e2229;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 32px;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h1 {
      color: #fc8181;
      font-size: 20px;
      margin-top: 0;
    }
    p {
      color: #a0aec0;
      font-size: 14px;
      line-height: 1.6;
    }
    .btn {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 16px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #2b6cb0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kingdom Runtime Unavailable</h1>
    <p>Kingdom Desktop was unable to establish a connection to the local Kingdom backend runtime process.</p>
    <p>Please verify your installation or check local process permissions, then click below to attempt reconnecting.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
